name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public repo charter
        run: npm run validate:boundary
      - name: Boundary regression (allow/deny fixtures)
        run: npm run test:boundary

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source manifest example
        run: npm run validate:source
      - name: Source contract regression
        run: npm run test:source
      - name: Validate article + artifact example
        run: npm run validate:article
      - name: Article contract regression
        run: npm run test:article
      - name: Validate rights catalog
        run: npm run validate:rights
      - name: Rights policy regression
        run: npm run test:rights

  editorial:
    name: Editorial gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Golden fixture passes the gates
        run: npm run check:gates
      - name: Quality gates regression
        run: npm run test:gates
