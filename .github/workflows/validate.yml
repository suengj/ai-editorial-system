name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce public repo charter
        run: npm run validate:boundary
      - name: Boundary regression (allow/deny fixtures)
        run: npm run test:boundary

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source manifest example
        run: npm run validate:source
      - name: Source contract regression
        run: npm run test:source
      - name: Validate article + artifact example
        run: npm run validate:article
      - name: Article contract regression
        run: npm run test:article
      - name: Validate rights catalog
        run: npm run validate:rights
      - name: Rights policy regression
        run: npm run test:rights

  editorial:
    name: Editorial gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Golden fixture passes the gates
        run: npm run check:gates
      - name: Quality gates regression
        run: npm run test:gates
      - name: Worked example conforms to its content-type profile
        run: npm run check:profile
      - name: Profiles and media strategy regression
        run: npm run test:profiles
      - name: Validate presentation plan example
        run: npm run validate:presentation
      - name: Semantic grammar regression
        run: npm run test:presentation

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Skill contracts
        run: npm run validate:skills
      - name: Skill format regression
        run: npm run test:skills
      - name: Validate artifact plan example
        run: npm run validate:plan
      - name: Skills pipeline regression
        run: npm run test:pipeline

  evaluation:
    name: Editorial evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the fixture corpus
        run: npm run eval
      - name: Evaluation method regression
        run: npm run test:eval

  artifacts:
    name: Artifact PoC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Artifacts regenerate byte-identically
        run: npm run poc:check
      - name: PoC regression
        run: npm run test:poc

  hitl:
    name: HITL and cross-source matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the review record
        run: npm run validate:hitl
      - name: HITL protocol regression
        run: npm run test:hitl
      - name: Cross-source acceptance matrix
        run: npm run matrix
      - name: Matrix regression
        run: npm run test:matrix

  handoff:
    name: Cross-repo handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Handoff receipt is reproducible and valid
        run: npm run handoff:check
      - name: Handoff regression
        run: npm run test:handoff

  certify:
    name: V1 certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certification matrix
        run: npm run certify
