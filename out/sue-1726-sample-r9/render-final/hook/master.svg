<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F7F5F0"/><text font-family="'Noto Serif KR', 'Noto Serif CJK KR', serif" font-size="68" font-weight="700" fill="#14213D" text-anchor="start" xml:space="preserve"><tspan x="65" y="176"><tspan>10월엔 쉬고, 12월엔 올린다</tspan></tspan></text><svg x="65" y="365" width="950" height="743" overflow="hidden"><svg xmlns="http://www.w3.org/2000/svg" width="950" height="743" viewBox="0 0 950 743" role="img"><title>10월·12월 인상 가격 비교</title><defs><filter id="number-panel-shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14213D" flood-opacity="0.12"/></filter></defs><rect x="5" y="5" width="940.00" height="733.00" rx="28" fill="#FFFFFF" filter="url(#number-panel-shadow)"/><text x="38.00" y="143.72" text-anchor="start" font-family="'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="35.89" font-weight="700" fill="#14213D">10월 회의 뒤</text><rect x="38.00" y="163.46" width="874.00" height="38.00" rx="19.00" fill="#14213D" fill-opacity="0.08"/><rect x="38.00" y="163.46" width="131.10" height="38.00" rx="19.00" fill="#FF6B5B"/><text x="169.10" y="341.85" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="147.78" font-weight="800" fill="#14213D">15%</text><text x="38.00" y="440.92" text-anchor="start" font-family="'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="35.89" font-weight="700" fill="#14213D">12월까지</text><rect x="38.00" y="460.66" width="874.00" height="38.00" rx="19.00" fill="#14213D" fill-opacity="0.08"/><rect x="38.00" y="460.66" width="707.94" height="38.00" rx="19.00" fill="#FF6B5B"/><text x="745.94" y="639.05" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="147.78" font-weight="800" fill="#14213D">81%</text></svg></svg><text font-family="Noto Sans CJK KR, Pretendard, sans-serif" font-size="32" font-weight="500" fill="#14213D" text-anchor="start" xml:space="preserve"><tspan x="65" y="1153"><tspan>10월 회의 뒤 인상 가격은 15%입니다.</tspan></tspan><tspan x="65" y="1194.6"><tspan>12월까지 한 차례 인상 가격은 81%로 시장에 높게 매겨졌습니다.</tspan></tspan></text></svg>