<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="400" role="img" aria-labelledby="pd-t pd-d">
  <title id="pd-t">일본 10년물은 되돌리고, 미국 10년물은 버틴다</title>
  <desc id="pd-d">2026년 9월 1일부터 4일까지 일본과 미국 10년 국채금리 변화(재확인된 관측치 3개). 일본은 3% 돌파 후 이틀 연속 하락, 미국은 4.8% 부근에서 거의 그대로. 일본 10년물 3.00 → 2.96 → 2.90(%), 미국 10년물 4.796 → 4.78 → 4.76(%). 세로축은 2%에서 6%까지, 가로축은 날짜 간격에 비례하는 실제 시간 척도다. 실선이 일본, 점선이 미국이며 계열 이름은 각 선의 끝에 직접 붙는다. 테두리 상자는 없다. Period: 2026-09-01, 2026-09-03, 2026-09-04 (재확인 조회일 2026-09-05; 9/5 관측치 없음). Source: canonical source(2026-09-02) + TradingEconomics 재확인(2026-09-05 조회). 좁은 화면에서는 같은 세 관측치와 같은 값이 더 좁고 높은 비율로 다시 배치되고 계열 이름은 선 끝의 위·아래로 옮겨가며, 글자 크기는 두 배치에서 동일하게 유지된다.</desc>
