    <path class="curve" d="M70,278 C96,272 120,262 142,250 C162,239 174,230 182,222 C204,204 230,184 256,168 C276,156 290,148 300,142"/>
    <path class="curve-b" d="M70,282 C96,276 120,266 142,254 C162,243 174,234 182,226 C204,228 230,236 256,246 C276,254 290,260 300,264"/>
    <circle class="onset" cx="182" cy="224" r="4"/>
  </g>

  <g class="lay-w">
    <line class="axis" x1="88" y1="240" x2="88" y2="64" marker-end="url(#pa-ar)"/>
    <line class="axis" x1="88" y1="240" x2="548" y2="240" marker-end="url(#pa-ar)"/>
    <line class="tick" x1="128" y1="240" x2="128" y2="246"/>
    <line class="tick" x1="208" y1="240" x2="208" y2="246"/>
    <line class="tick" x1="288" y1="240" x2="288" y2="246"/>
    <line class="tick" x1="368" y1="240" x2="368" y2="246"/>
    <line class="tick" x1="448" y1="240" x2="448" y2="246"/>
    <line class="tick" x1="528" y1="240" x2="528" y2="246"/>
    <line class="guide" x1="308" y1="92" x2="308" y2="240"/>
    <path class="curve" d="M108,214 C150,206 190,194 228,178 C262,164 286,150 308,136 C340,116 380,98 430,86 C462,78 486,74 508,70"/>
    <path class="curve-b" d="M108,218 C150,210 190,198 228,182 C262,168 286,154 308,140 C340,140 380,148 430,162 C462,171 486,178 508,184"/>
    <circle class="onset" cx="308" cy="138" r="4"/>
  </g>

  <text class="t-ax a-yax">개선 정도</text>
  <text class="t-ax a-xax">최적화 루프 반복</text>
  <text class="t-on a-onset">분기 시작점</text>
  <text class="t-note a-gaming">재고·CapEx·아웃소싱 조정</text>
  <text class="t-ser a-metric">측정된 지표</text>
  <text class="t-ser a-reality">관찰된 현실</text>
</svg>
