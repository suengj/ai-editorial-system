<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="350" role="img" aria-labelledby="pa-t pa-d">
  <title id="pa-t">반복된 최적화에서 지표 곡선과 현실 곡선이 갈라지는 지점</title>
  <desc id="pa-d">가로축은 최적화 루프가 반복된 횟수(순서)를, 세로축은 개선 정도를 나타내는 방향 전용 척도를 뜻한다. 절대 수치는 표기하지 않는다. 두 곡선은 왼쪽에서 거의 겹친 채 함께 상승한다. 가로축 중간의 분기 시작점을 지나면 실선(측정된 지표)은 계속 가파르게 상승하고, 점선(관찰된 현실)은 상승을 멈춘 뒤 하락해, 오른쪽 끝에서 두 곡선의 세로 간격이 가장 크게 벌어진다. 분기 시작점에는 '재고·CapEx·아웃소싱 조정'이라는 게이밍 행동 주석이 곡선 위 지점에 직접 붙어 있고, 그 지점에서 세로 안내선이 가로축까지 내려온다. 테두리 상자는 하나도 쓰지 않으며, 두 곡선의 구분은 선 스타일과 끝점 레이블만으로 이루어진다. 좁은 화면에서는 같은 두 곡선이 더 좁고 높은 비율로 다시 배치되고, 끝점 레이블은 곡선 끝의 위·아래로 옮겨가며, 글자 크기는 그대로 유지된다. 이 곡선은 관측 데이터가 아니라 해석적 모델이다.</desc>
  <defs>
    <marker id="pa-ar" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,5 L0,10 Z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; fill: currentColor; }
    .lay-w { display: none; }
    .axis { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
    .tick { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1; }
    .curve { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-opacity: 0.9; stroke-linecap: round; }
    .curve-b { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-opacity: 0.7; stroke-dasharray: 5 4; stroke-linecap: round; }
    .guide { stroke: currentColor; stroke-opacity: 0.28; stroke-width: 1; stroke-dasharray: 2 4; }
    .onset { fill: #C9A671; }
    .t-ax { font-size: 15px; fill-opacity: 0.62; }
    .t-ser { font-size: 16px; font-weight: 600; }
    .t-on { font-size: 16px; font-weight: 600; }
    .t-note { font-size: 15px; fill-opacity: 0.78; }

    /* narrow layout (default) — 358px article column */
    .a-yax { transform: translate(8px, 28px); }
    .a-xax { transform: translate(52px, 322px); }
    .a-onset { transform: translate(182px, 60px); text-anchor: middle; }
    .a-gaming { transform: translate(178px, 84px); text-anchor: middle; }
    .a-metric { transform: translate(300px, 128px); text-anchor: end; }
    .a-reality { transform: translate(300px, 286px); text-anchor: end; }

    /* wide layout — 672px article column */
    @media (min-width: 640px) {
      svg { height: 320px; }
      .lay-n { display: none; }
      .lay-w { display: block; }
      .a-yax { transform: translate(88px, 44px); }
      .a-xax { transform: translate(88px, 266px); }
      .a-onset { transform: translate(308px, 46px); text-anchor: middle; }
      .a-gaming { transform: translate(308px, 70px); text-anchor: middle; }
      .a-metric { transform: translate(516px, 74px); text-anchor: start; }
      .a-reality { transform: translate(516px, 188px); text-anchor: start; }
    }
  </style>

  <g class="lay-n">
    <line class="axis" x1="52" y1="296" x2="52" y2="112" marker-end="url(#pa-ar)"/>
    <line class="axis" x1="52" y1="296" x2="326" y2="296" marker-end="url(#pa-ar)"/>
    <line class="tick" x1="84" y1="296" x2="84" y2="302"/>
