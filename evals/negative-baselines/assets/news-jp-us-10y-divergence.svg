  <title id="title">일본 10년물은 되돌리고, 미국 10년물은 버틴다</title>
  <desc id="desc">2026년 9월 1일부터 4일까지 일본과 미국 10년 국채금리 변화(재확인된 관측치 3개). 일본은 3% 돌파 후 이틀 연속 하락, 미국은 4.8% 부근에서 거의 그대로. Period: 2026-09-01, 2026-09-03, 2026-09-04 (재확인 조회일 2026-09-05; 9/5 관측치 없음). Source: canonical source(2026-09-02) + TradingEconomics 재확인(2026-09-05 조회)</desc>
